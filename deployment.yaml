apiVersion: apps/v1
kind: Deployment
metadata:
  name: hugoreis-app
  namespace: default
  labels:
    app: hugoreis-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hugoreis-app
  template:
    metadata:
      labels:
        app: hugoreis-app
    spec:
      containers:
      - name: hugoreis-app
        image: ord.ocir.io/axmlxl6nbuxb/hugoreis-app:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
