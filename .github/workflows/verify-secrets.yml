name: Validar Secrets e Conexao OCI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  validate-secrets:
    name: Teste de Autenticacao e Segredos
    runs-on: ubuntu-latest

    steps:
      - name: 1. Testar Login no OCI Registry (OCIR)
        env:
          OCIR_USER: ${{ secrets.OCI_OCIR_USERNAME }}
          OCIR_TOKEN: ${{ secrets.OCI_OCIR_AUTH_TOKEN }}
        run: |
          echo "Testando login no Container Registry (ord.ocir.io)..."
          echo "$OCIR_TOKEN" | docker login ord.ocir.io -u "$OCIR_USER" --password-stdin
          echo "✅ Login no OCIR realizado com sucesso!"

      - name: 2. Instalar e Configurar OCI CLI
        env:
          OCI_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_FP: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          echo "Instalando OCI CLI no runner..."
          python3 -m pip install oci-cli --break-system-packages --quiet
          
          mkdir -p ~/.oci
          echo "$OCI_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat << CFG > ~/.oci/config
          [DEFAULT]
          user=$OCI_USER
          fingerprint=$OCI_FP
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=~/.oci/oci_api_key.pem
          CFG
          chmod 600 ~/.oci/config

      - name: 3. Testar Autenticacao da API OCI (User, Fingerprint, Key)
        run: |
          echo "Validando par de chaves e tenant consultando o Namespace..."
          NS=$(oci os ns get --query "data" --raw-output)
          echo "Namespace validado: $NS"
          echo "✅ Autenticacao OCI CLI aprovada com sucesso!"

      - name: 4. Testar Conexao com o Cluster Kubernetes (OKE)
        env:
          CLUSTER_ID: ${{ secrets.OKE_CLUSTER_OCID }}
          REGION: ${{ secrets.OCI_REGION }}
        run: |
          echo "Gerando kubeconfig para o cluster OKE..."
          mkdir -p ~/.kube
          oci ce cluster create-kubeconfig \
            --cluster-id "$CLUSTER_ID" \
            --file ~/.kube/config \
            --region "$REGION" \
            --token-version 2.0.0
          chmod 600 ~/.kube/config

          echo "Consultando os nos de trabalho via kubectl..."
          kubectl get nodes -o wide
          echo "✅ Conexao com o cluster OKE validada com sucesso!"
